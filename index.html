<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    min-height:100vh;
    background:radial-gradient(circle at top,#1b2735,#090a0f);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    font-family: "Poppins", sans-serif;
}

.card{
    width:100%;
    max-width:450px;
    background:rgba(20,20,20,0.95);
    border-radius:20px;
    padding:32px 24px;
    text-align:center;
    box-shadow:0 0 35px rgba(0,255,255,0.15);
    position:relative;
}

/* Badge */
.badge{
    position:absolute;
    top:-14px;
    left:50%;
    transform:translateX(-50%);
    background:#00ffff;
    color:#000;
    padding:6px 18px;
    border-radius:30px;
    font-size:13px;
    font-weight:600;
}

.button {
	margin: 30px 0;
}



.card h1{
    font-size:24px;
    color:#ffffff;
    margin-bottom:18px;
    font-family: "Poppins", sans-serif;
}

.card h1 span{
    color:#00ffff;
}


.button a {
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            background-color: green;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
            padding: 15px 60px;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            display: inline-block;
            animation: zoomInOut 2s infinite ease-in-out;
        }

        .button a:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(33, 154, 212, 0.8);
        }

        @keyframes zoomInOut {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }


.card h3 {
	color: #fff;
}

/* Text */
.card p{
    font-size:14px;
    color:#cfcfcf;
    line-height:1.6;
    margin-bottom:10px;
    font-family: "Poppins", sans-serif;
}

.exp{
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid rgba(255,255,255,0.1);
    font-size:15px;
    font-weight:600;
    color:#ffffff;
}

.card img {
	width: 90px;
	border-radius: 50px;
}

/* Desktop */
@media(min-width:768px){
    .card{
        padding:42px 36px;
    }
    .card h1{
        font-size:28px;
    }
    .card p{
        font-size:15px;
    }
}

@media only screen and (max-width: 500px) {
 
.button a {
	font-size: 16px;
	font-weight: 700;
	text-transform: uppercase;
	letter-spacing: 4px;

	box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
	padding: 15px 38px;
}
}
